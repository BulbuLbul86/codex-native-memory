[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-native-memory"
version = "0.1.0"
description = "Local cross-session memory for Codex Desktop and Codex CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Local developer" }]
dependencies = []

[project.scripts]
codex-native-memory = "codex_native_memory.cli:main"

[tool.setuptools.packages.find]
include = ["codex_native_memory*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
